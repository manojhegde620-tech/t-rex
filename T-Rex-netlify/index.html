<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --panel2:#f3f5f8; --line:#e4e8ee; --line2:#eef1f5;
    --txt:#1b2333; --muted:#6a7688; --faint:#9aa4b2;
    --accent:#2563eb; --accent-weak:#eef3fe;
    --green:#15803d; --green-bg:#eaf6ee; --red:#dc2626; --red-bg:#fdecec; --amber:#b45309;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  .app{display:flex;min-height:100vh}
  /* sidebar */
  .sidebar{width:212px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding:2px 4px}
  .brand-mark{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;letter-spacing:.5px}
  .brand-mark-img{width:60px;height:60px;object-fit:contain;display:block;flex-shrink:0}
  .brand-name{font-weight:700;font-size:22px;line-height:1.05;letter-spacing:-.3px}.brand-sub{color:var(--muted);font-size:11.5px;margin-top:3px}
  .nav{display:flex;flex-direction:column;gap:1px}
  .nav button{display:block;padding:9px 12px;border-radius:7px;color:var(--muted);background:none;border:none;font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;font-family:inherit;width:100%}
  .nav button:hover{background:var(--panel2);color:var(--txt)}
  .nav button.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
  .nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);padding:14px 12px 6px}
  .side-foot{margin-top:auto;color:var(--faint);font-size:11px;line-height:1.7;padding-top:14px;border-top:1px solid var(--line)}
  /* content */
  .content{flex:1;padding:22px 26px;max-width:1440px;width:100%}
  .page-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
  h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.2px}
  h2{font-size:14px;margin:0;font-weight:600}
  .sub{color:var(--muted);font-size:12.5px}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  /* cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
  .card.stat{margin-bottom:0;padding:14px 16px}
  .stat-lbl{color:var(--muted);font-size:11.5px;font-weight:500;margin-bottom:6px}
  .stat-num{font-size:21px;font-weight:650;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
  .stat-sub{font-size:12px;margin-top:3px;font-weight:500}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:1000px){.two-col{grid-template-columns:1fr}}
  @media(max-width:820px){
    .app{flex-direction:column}
    .sidebar{width:100%;height:auto;position:sticky;top:0;flex-direction:column;border-right:none;border-bottom:1px solid var(--line);padding:10px 12px;z-index:30}
    .brand{margin-bottom:10px;gap:10px}
    .brand-mark-img{width:40px;height:40px}
    .brand-name{font-size:18px}
    .nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
    .nav button{white-space:nowrap;padding:8px 13px;border:1px solid var(--line);border-radius:8px;flex:0 0 auto}
    .nav button.on{box-shadow:none;border-color:#bcd0fb}
    .nav .grp{display:none}
    .side-foot{display:none}
    .content{padding:14px 14px 96px;max-width:100%}
    .page-head h1{font-size:18px}
    .cards{grid-template-columns:1fr 1fr;gap:10px}
    .card{padding:14px}
    .two-col{grid-template-columns:1fr}
    .scroll{max-height:none;overflow:visible}
    table{width:100%}
    table thead{display:none}
    table tr{display:block;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:4px 10px;background:var(--panel)}
    table td{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right;border:none;border-bottom:1px solid var(--line2);padding:9px 2px}
    table tr td:last-child{border-bottom:none}
    table td::before{content:attr(data-label);color:var(--muted);font-weight:600;text-align:left;white-space:nowrap;flex:0 0 auto}
    table td:empty{display:none}
    table tfoot tr{background:var(--panel2)}
    .filters .field, .field.grow{min-width:100%}
    .modal{padding:16px 16px}
    .kv{gap:14px}
  }
  @media(max-width:420px){ .cards{grid-template-columns:1fr} }
  /* tables */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
  td{padding:10px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--panel2)}
  .r{text-align:right;font-variant-numeric:tabular-nums}.c{text-align:center}
  tfoot td{border-top:1px solid var(--line);border-bottom:none;font-weight:600;background:var(--panel2)}
  .scroll{overflow:auto}
  /* buttons */
  .btn{background:var(--accent);color:#fff;border:1px solid var(--accent);padding:8px 15px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;font-family:inherit}
  .btn:hover{background:#1d4fd7}
  .btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--txt);font-weight:500}
  .btn.ghost:hover{border-color:var(--faint);background:var(--panel2)}
  .btn-sm{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:4px 9px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit}
  .btn-sm:hover{border-color:var(--accent);color:var(--accent)}
  .btn-sm.danger:hover{border-color:var(--red);color:var(--red)}
  input,select,textarea{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:7px;font-size:13px;font-family:inherit;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
  .field label{color:var(--muted);font-size:12px;font-weight:500}
  .inline{display:flex;gap:8px;align-items:center}
  .search{max-width:250px}
  hr{border:none;border-top:1px solid var(--line)}
  /* tags/chips */
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);padding:5px 11px;border-radius:7px;font-size:12px;cursor:pointer;color:var(--muted)}
  .chip:hover{border-color:var(--faint)}
  .chip.on{background:var(--accent-weak);color:var(--accent);border-color:#bcd0fb;font-weight:500}
  .tag{display:inline-block;background:var(--panel2);color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:5px;font-size:11px;margin:1px 2px;white-space:nowrap;font-weight:500}
  .tag.qr{background:var(--green-bg);color:var(--green);border-color:#cfe8d6}
  .tag.sbm{background:#fdf3e6;color:var(--amber);border-color:#f3e0c4}
  .tag.fut{background:var(--accent-weak);color:var(--accent);border-color:#cfe0fd}
  .rate{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .pill{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:500;border:1px solid transparent}
  .pill.open{background:#fdf3e6;color:var(--amber);border-color:#f3e0c4}
  .pill.done{background:var(--green-bg);color:var(--green)}
  .pill.high{background:var(--red-bg);color:var(--red)}
  .pill.low{background:var(--panel2);color:var(--muted);border-color:var(--line)}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(23,30,45,.4);display:none;align-items:flex-start;justify-content:center;padding:44px 16px;z-index:50;overflow:auto}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:560px;padding:22px 24px;box-shadow:0 16px 48px rgba(23,30,45,.18)}
  .modal.wide{max-width:840px}
  .modal h3{margin:0 0 16px;font-size:16px;font-weight:650}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
  .toast{position:fixed;bottom:22px;right:22px;background:var(--txt);color:#fff;padding:11px 18px;border-radius:9px;z-index:80;display:none;font-size:13px;box-shadow:0 8px 24px rgba(23,30,45,.25)}
  .toast.show{display:block}
  .empty{color:var(--muted);text-align:center;padding:30px 12px;font-size:13px}
  .price-warn{color:var(--faint)}
  code{background:var(--panel2);padding:1px 6px;border-radius:4px;color:var(--txt);font-size:12px}
  .note p{color:var(--muted);line-height:1.65}
  .kv{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:14px}
  .kv .k{font-size:11px;color:var(--faint);margin-bottom:2px}
  .lead{font-variant-numeric:tabular-nums}
</style>
</head>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================ STATE ============================ */
const LS_KEY = "trex_portfolio_desk_v1";
const DEFAULT_TAGS = ["Quarterly Results","Strong Business Model","Futuristic"];
let S = normalize(load());

function blankState(){
  return {
    watchlist:[], clients:[], holdings:[], tasks:[], alerts:[],
    tags:[...DEFAULT_TAGS], prices:{}, meta:{},
    settings:{ provider:"netlify", apiKey:"", suffix:"", proxy:"", currency:"₹", notify:{ email:"", sound:true, browser:true, intervalMin:5 } }
  };
}
function load(){
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const s=JSON.parse(raw); return Object.assign(blankState(), s); } }
  catch(e){ console.warn(e); }
  return blankState();
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ============================ HELPERS ============================ */
const $ = (s,el=document)=>el.querySelector(s);
const cur = n => (S.settings.currency||"₹") + fmt(n);
function fmt(n){ if(n===null||n===undefined||isNaN(n)) return "—"; return Number(n).toLocaleString('en-IN',{maximumFractionDigits:2}); }
function fmt0(n){ if(n===null||n===undefined||isNaN(n)) return "—"; return Number(n).toLocaleString('en-IN',{maximumFractionDigits:0}); }
function esc(s){ return (s??"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function priceOf(sym){ const p=S.prices[sym]; return p&&isFinite(p.price)?p.price:null; }
function metaOf(sym){ return S.meta[sym]||{name:sym,sector:""}; }
function setMeta(sym,name,sector){ if(!sym) return; const m=S.meta[sym]||{}; if(name) m.name=name; if(sector) m.sector=sector; S.meta[sym]=m; }
function tagClass(t){ if(t==="Quarterly Results")return"qr"; if(t==="Strong Business Model")return"sbm"; if(t==="Futuristic")return"fut"; return""; }
function rating(n){ n=+n||0; return `${n}/5`; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2400); }
function pct(n){ return (n===null||n===undefined||isNaN(n))?"—":fmt(n)+"%"; }

/* holding math */
function hValue(h){ const p=priceOf(h.symbol); return (p!==null? p : h.avgCost) * h.qty; }
function hLiveValue(h){ const p=priceOf(h.symbol); return p!==null? p*h.qty : null; }
function hInvested(h){ return h.avgCost*h.qty; }
function hPnl(h){ const lv=hLiveValue(h); return lv===null?null: lv - hInvested(h); }
function hPnlPct(h){ const inv=hInvested(h); const pnl=hPnl(h); return (pnl===null||inv===0)?null: pnl/inv*100; }

/* ============================ ROUTER ============================ */
const TABS = { dashboard:renderDashboard, watchlist:renderWatchlist, clients:renderClients, holdings:renderHoldings, exposure:renderExposure, tasks:renderTasks, signals:renderSignals, news:renderNews, alerts:renderAlerts, settings:renderSettings };
let current="dashboard";
$("#nav").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return; go(b.dataset.tab); });
function go(tab){ current=tab; [...$("#nav").querySelectorAll("button")].forEach(b=>b.classList.toggle("on",b.dataset.tab===tab)); render(); }
function render(){ TABS[current](); labelTables(); }
function labelTables(root){
  (root||document).querySelectorAll('table').forEach(function(t){
    var ths=[].slice.call(t.querySelectorAll('thead th')).map(function(th){return th.textContent.trim();});
    if(!ths.length) return;
    [].slice.call(t.querySelectorAll('tbody tr, tfoot tr')).forEach(function(tr){
      var ci=0;
      [].slice.call(tr.children).forEach(function(td){
        td.setAttribute('data-label', ths[ci]||'');
        ci += (td.colSpan||1);
      });
    });
  });
}

/* ============================ DASHBOARD ============================ */
function renderDashboard(){
  const aum = S.holdings.reduce((a,h)=>a+hValue(h),0);
  const invested = S.holdings.reduce((a,h)=>a+hInvested(h),0);
  const pnl = aum - invested;
  const pnlPct = invested? pnl/invested*100 : 0;
  const openTasks = S.tasks.filter(t=>t.status!=="done");
  const priced = S.holdings.filter(h=>priceOf(h.symbol)!==null).length;
  const byVal=[...S.holdings].map(h=>({h,v:hValue(h)})).sort((a,b)=>b.v-a.v).slice(0,6);
  const movers=S.holdings.filter(h=>hPnlPct(h)!==null).sort((a,b)=>hPnlPct(b)-hPnlPct(a));
  const gainers=movers.slice(0,4), losers=movers.slice(-4).reverse();
  const secMap={}; S.holdings.forEach(h=>{ const s=metaOf(h.symbol).sector||"Uncategorised"; secMap[s]=(secMap[s]||0)+hValue(h); });
  const secs=Object.entries(secMap).sort((a,b)=>b[1]-a[1]);

  $("#view").innerHTML = `
  <div class="page-head"><div><h1>Dashboard</h1><div class="sub">Overview across ${S.clients.length} account${S.clients.length!==1?'s':''}</div></div>
    <div class="row">
      <button class="btn ghost" onclick="refreshPrices()">Refresh prices</button>
      <button class="btn" onclick="openHoldingForm()">Add holding</button>
    </div>
  </div>
  <div class="cards">
    <div class="card stat"><div class="stat-lbl">Total AUM</div><div class="stat-num">${cur(aum)}</div></div>
    <div class="card stat"><div class="stat-lbl">Invested</div><div class="stat-num">${cur(invested)}</div></div>
    <div class="card stat"><div class="stat-lbl">Unrealised P&amp;L</div><div class="stat-num ${pnl>=0?'pos':'neg'}">${cur(pnl)}</div><div class="stat-sub ${pnl>=0?'pos':'neg'}">${pnl>=0?'+':''}${fmt(pnlPct)}%</div></div>
    <div class="card stat"><div class="stat-lbl">Holdings</div><div class="stat-num">${S.holdings.length}</div><div class="stat-sub muted">${priced} live-priced</div></div>
    <div class="card stat"><div class="stat-lbl">Watchlist</div><div class="stat-num">${S.watchlist.length}</div></div>
    <div class="card stat"><div class="stat-lbl">Open follow-ups</div><div class="stat-num">${openTasks.length}</div></div>
  </div>

  <div class="two-col">
    <div class="card">
      <div class="card-head"><h2>Largest positions</h2><a href="#" onclick="go('holdings');return false">View all</a></div>
      ${byVal.length? `<table><thead><tr><th>Stock</th><th>Client</th><th class="r">Value</th><th class="r">P&amp;L %</th></tr></thead><tbody>
        ${byVal.map(({h,v})=>{const pp=hPnlPct(h);return `<tr><td><b>${esc(h.symbol)}</b></td><td class="muted">${esc(clientName(h.clientId))}</td><td class="r">${cur(v)}</td><td class="r ${pp>=0?'pos':'neg'}">${pct(pp)}</td></tr>`}).join("")}
      </tbody></table>`: `<div class="empty">No holdings yet.</div>`}
    </div>
    <div class="card">
      <div class="card-head"><h2>Sector allocation</h2></div>
      ${secs.length? `<table><thead><tr><th>Sector</th><th class="r">Value</th><th class="r">Weight</th></tr></thead><tbody>
        ${secs.map(([s,v])=>`<tr><td>${esc(s)}</td><td class="r">${cur(v)}</td><td class="r">${pct(aum? v/aum*100:0)}</td></tr>`).join("")}
      </tbody></table>` : `<div class="empty">Add holdings with a sector to see allocation.</div>`}
    </div>
  </div>

  <div class="two-col">
    <div class="card">
      <div class="card-head"><h2>Top movers</h2></div>
      ${movers.length?`<div class="row" style="gap:32px;align-items:flex-start">
        <div style="flex:1"><div class="faint" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Gainers</div>${gainers.map(h=>`<div class="row" style="justify-content:space-between;padding:5px 0"><span>${esc(h.symbol)}</span><span class="pos">+${fmt(hPnlPct(h))}%</span></div>`).join("")||'<span class="muted">—</span>'}</div>
        <div style="flex:1"><div class="faint" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Laggards</div>${losers.map(h=>`<div class="row" style="justify-content:space-between;padding:5px 0"><span>${esc(h.symbol)}</span><span class="neg">${fmt(hPnlPct(h))}%</span></div>`).join("")||'<span class="muted">—</span>'}</div>
      </div>`:`<div class="empty">Refresh prices to see movers.</div>`}
    </div>
    <div class="card">
      <div class="card-head"><h2>Follow-ups due</h2><a href="#" onclick="go('tasks');return false">View all</a></div>
      ${openTasks.length? `<table><tbody>${openTasks.sort(byDue).slice(0,6).map(t=>`<tr><td>${esc(t.title)}<div class="faint" style="font-size:11px;margin-top:2px">${esc(clientName(t.clientId))}</div></td><td class="r muted">${t.due||'—'}</td><td class="r">${t.priority==='High'?'<span class="pill high">High</span>':''}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">No open follow-ups.</div>`}
    </div>
  </div>`;
}
function byDue(a,b){ return (a.due||"9999").localeCompare(b.due||"9999"); }

/* ============================ WATCHLIST ============================ */
let wlFilter=new Set(), wlSearch="";
function renderWatchlist(){
  $("#view").innerHTML=`
  <div class="page-head"><div><h1>Watchlist</h1><div class="sub">Stock ideas by conviction and theme</div></div>
    <div class="row">
      <input class="search" placeholder="Search symbol / name / sector" value="${esc(wlSearch)}" oninput="wlSearch=this.value;renderWatchlistBody()"/>
      <button class="btn ghost" onclick="openTagManager()">Manage tags</button>
      <button class="btn" onclick="openWatchForm()">Add stock</button>
    </div>
  </div>
  <div class="card">
    <div class="card-head"><div class="chips" id="wlchips"></div><span class="muted" id="wlcount"></span></div>
    <div class="scroll" id="wlbody"></div>
  </div>`;
  renderChips(); renderWatchlistBody();
}
function renderChips(){
  const el=$("#wlchips"); if(!el)return;
  el.innerHTML = S.tags.map(t=>`<span class="chip ${wlFilter.has(t)?'on':''}" onclick="toggleWlFilter('${esc(t)}')">${esc(t)}</span>`).join("")
    + (wlFilter.size? `<span class="chip" onclick="wlFilter.clear();renderWatchlist()">Clear</span>`:"");
}
function toggleWlFilter(t){ wlFilter.has(t)?wlFilter.delete(t):wlFilter.add(t); renderWatchlist(); }
function renderWatchlistBody(){
  const q=wlSearch.toLowerCase();
  const rows=S.watchlist.filter(w=>{
    const okTag=wlFilter.size===0||(w.tags||[]).some(t=>wlFilter.has(t));

    return okTag&&okQ;
  }).sort((a,b)=>(b.conviction||0)-(a.conviction||0));

  </tbody></table>`;
}

/* ============================ EXPOSURE ============================ */
function renderExposure(){
  const aum=S.holdings.reduce((a,h)=>a+hValue(h),0)||1;
  const stock={};
  S.holdings.forEach(h=>{ const s=stock[h.symbol]||(stock[h.symbol]={qty:0,val:0,inv:0,clients:new Set()}); s.qty+=h.qty; s.val+=hValue(h); s.inv+=hInvested(h); s.clients.add(h.clientId); });
  const stocks=Object.entries(stock).sort((a,b)=>b[1].val-a[1].val);
  const sec={}; S.holdings.forEach(h=>{const k=metaOf(h.symbol).sector||"Uncategorised"; sec[k]=(sec[k]||0)+hValue(h);});
  const secs=Object.entries(sec).sort((a,b)=>b[1]-a[1]);
  const cl=S.clients.map(c=>[c.name,clientValue(c.id)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);

  $("#view").innerHTML=`
  <div class="page-head"><div><h1>Aggregated exposure</h1><div class="sub">Across all ${S.clients.length} accounts · ${cur(aum===1?0:aum)} AUM</div></div></div>
  <div class="card">
    <div class="card-head"><h2>By stock</h2></div>
    <div class="scroll">${stocks.length?`<table><thead><tr><th>Stock</th><th>Sector</th><th class="r">Total qty</th><th class="r">Value</th><th class="r">% of AUM</th><th class="r">P&amp;L %</th><th class="r">Held by</th></tr></thead><tbody>
    ${stocks.map(([sym,s])=>{const pnlp=s.inv?(s.val-s.inv)/s.inv*100:0,w=s.val/aum*100;return `<tr>
      <td><b>${esc(sym)}</b></td><td class="muted">${esc(metaOf(sym).sector||"")}</td>
      <td class="r">${fmt0(s.qty)}</td><td class="r">${cur(s.val)}</td><td class="r">${pct(w)}</td>
      <td class="r ${pnlp>=0?'pos':'neg'}">${pct(pnlp)}</td>
      <td class="r">${s.clients.size} client${s.clients.size!==1?'s':''}</td>
    </tr>`}).join("")}</tbody></table>`:`<div class="empty">No holdings to aggregate.</div>`}</div>
  </div>
  <div class="two-col">
    <div class="card"><div class="card-head"><h2>By sector</h2></div>
      ${secs.length?`<table><thead><tr><th>Sector</th><th class="r">Value</th><th class="r">Weight</th></tr></thead><tbody>${secs.map(([s,v])=>`<tr><td>${esc(s)}</td><td class="r">${cur(v)}</td><td class="r">${pct(v/aum*100)}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">—</div>`}
    </div>
    <div class="card"><div class="card-head"><h2>By client</h2></div>
      ${cl.length?`<table><thead><tr><th>Client</th><th class="r">Value</th><th class="r">Weight</th></tr></thead><tbody>${cl.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="r">${cur(v)}</td><td class="r">${pct(v/aum*100)}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">—</div>`}
    </div>
  </div>`;
}

async function refreshPrices(){
  const syms=[...new Set([...S.holdings.map(h=>h.symbol),...S.watchlist.map(w=>w.symbol)])];
  if(!syms.length){ toast("Nothing to price"); return; }
  const st=S.settings;
  if(st.provider==="manual"||(st.provider!=="netlify"&&!st.apiKey)){ toast("Set a provider + API key in Settings, or edit prices manually"); openPricesEditor(); return; }
  toast(`Fetching ${syms.length} prices…`);
  let ok=0,fail=0;
  for(const sym of syms){
    try{ const p=await fetchOne(sym); if(p!==null&&isFinite(p)){ S.prices[sym]={price:p,ts:Date.now()}; ok++; } else fail++; }
    catch(e){ fail++; }
    await sleep(st.provider==="alphavantage"?900:250);
  }
  save(); render();
  toast(`Prices updated: ${ok} ok${fail?`, ${fail} failed`:''}`);
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function fetchOne(sym){
  const st=S.settings; const s=encodeURIComponent(sym+(st.suffix||""));
  let url;
  if(st.provider==="alphavantage") url=`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${s}&apikey=${encodeURIComponent(st.apiKey)}`;
  else if(st.provider==="twelvedata") url=`https://api.twelvedata.com/price?symbol=${s}&apikey=${encodeURIComponent(st.apiKey)}`;
  else if(st.provider==="netlify") url=`/.netlify/functions/price?symbol=${s}`;
  else return null;
  if(st.proxy && st.provider!=="netlify") url=st.proxy+encodeURIComponent(url);
  const r=await fetch(url); const j=await r.json();
  if(st.provider==="alphavantage"){ const q=j["Global Quote"]; const v=q&&q["05. price"]; return v?parseFloat(v):null; }
  if(st.provider==="twelvedata"){ return j&&j.price?parseFloat(j.price):null; }
  if(st.provider==="netlify"){ return j&&j.price!=null?parseFloat(j.price):null; }
  return null;
}

/* ============================ CSV / JSON ============================ */
function parseCsv(text){
  return text.split(/\r?\n/).filter(l=>l.trim()).map(l=>{
    const out=[];let cur="",q=false;
    for(let i=0;i<l.length;i++){const c=l[i];
      if(c==='"'){ if(q&&l[i+1]==='"'){cur+='"';i++;} else q=!q; }
      else if(c===','&&!q){out.push(cur);cur="";}
      else cur+=c;
    } out.push(cur); return out.map(x=>x.trim());
  });
}
function importHoldingsCsv(input){
  const f=input.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=()=>{ try{
    const rows=parseCsv(rd.result); let start=0;
    if(rows[0]&&/client/i.test(rows[0][0])) start=1;
    let n=0;
    for(let i=start;i<rows.length;i++){ const [cname,sym,qty,avg,sector,name]=rows[i]; if(!cname||!sym)continue;
      let c=S.clients.find(x=>x.name.toLowerCase()===cname.toLowerCase());
      if(!c){ c={id:uid(),name:cname,demat:"",broker:"",contact:"",email:"",notes:""}; S.clients.push(c); }
      const symbol=sym.toUpperCase(); setMeta(symbol,name,sector);
      S.holdings.push({id:uid(),clientId:c.id,symbol,qty:+qty||0,avgCost:+avg||0}); n++;
    }
    save(); toast(`Imported ${n} holdings`); renderSettings();
  }catch(e){ alert("Could not parse CSV: "+e.message); } };
  rd.readAsText(f); input.value="";
}
function importPricesCsv(input){
  const f=input.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=()=>{ try{
    const rows=parseCsv(rd.result); let start=0; if(rows[0]&&/symbol/i.test(rows[0][0]))start=1; let n=0;
    for(let i=start;i<rows.length;i++){ const [sym,price]=rows[i]; if(!sym)continue; const v=parseFloat(price); if(isFinite(v)){ S.prices[sym.toUpperCase()]={price:v,ts:Date.now()}; n++; } }
    save(); toast(`Imported ${n} prices`);
  }catch(e){ alert("Could not parse CSV: "+e.message); } };
  rd.readAsText(f); input.value="";
}

    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="submitForm()">Save</button></div>`;

function normalize(s){ s=s||{}; s.alerts=s.alerts||[]; s.settings=s.settings||{}; s.settings.notify=Object.assign({email:"",sound:true,browser:true,intervalMin:5}, s.settings.notify||{}); s.settings.cloud=Object.assign({enabled:false,secret:""}, s.settings.cloud||{}); return s; }
function watchSymbols(){ return [...new Set([...S.watchlist.map(w=>w.symbol),...S.holdings.map(h=>h.symbol)])]; }

async function apiSeries(sym){
  const s=encodeURIComponent(sym+(S.settings.suffix||""));
  const r=await fetch(`/.netlify/functions/series?symbol=${s}&range=6mo`);
  if(!r.ok) throw new Error("series "+r.status);
  return await r.json();
}
async function apiNews(sym){
  const name=metaOf(sym).name||sym;
  const r=await fetch(`/.netlify/functions/news?q=${encodeURIComponent(name)}&symbol=${encodeURIComponent(sym)}`);
  if(!r.ok) throw new Error("news "+r.status);
  return await r.json();
}
function rsiFromCloses(cl,period){ period=period||14; cl=(cl||[]).filter(x=>x!=null); if(cl.length<=period) return null;
  let g=0,l=0; for(let i=1;i<=period;i++){const c=cl[i]-cl[i-1]; if(c>=0)g+=c; else l-=c;} g/=period; l/=period;
  let rsi=l===0?100:100-100/(1+g/l);
  for(let i=period+1;i<cl.length;i++){const c=cl[i]-cl[i-1];const gi=c>0?c:0,li=c<0?-c:0; g=(g*(period-1)+gi)/period; l=(l*(period-1)+li)/period; rsi=l===0?100:100-100/(1+g/l);} return rsi; }
function timeAgo(s){ const d=new Date(s); if(isNaN(d)) return ""; const m=Math.floor((Date.now()-d)/60000); if(m<1)return "just now"; if(m<60)return m+"m ago"; const hh=Math.floor(m/60); if(hh<24)return hh+"h ago"; return Math.floor(hh/24)+"d ago"; }

/* ---------- SIGNALS ---------- */
let _sigCache=null,_sigTs=0,_sigBusy=false;
function computeSignals(sym,d){
  const out=[]; const m=(d&&d.meta)||{}; const price=m.price;
  const vols=(d.volumes||[]).filter(x=>x!=null); const closes=(d.closes||[]).filter(x=>x!=null);
  const rsi=rsiFromCloses(closes);
  if(price!=null&&m.high52&&price>=m.high52*0.97) out.push({sym,sev:"pos",msg:`Near 52-week high (${fmt(m.high52)})`});
  if(price!=null&&m.low52&&price<=m.low52*1.03) out.push({sym,sev:"neg",msg:`Near 52-week low (${fmt(m.low52)})`});
  if(rsi!=null&&rsi<=30) out.push({sym,sev:"pos",msg:`RSI ${fmt(rsi)} — oversold`});
  if(rsi!=null&&rsi>=70) out.push({sym,sev:"neg",msg:`RSI ${fmt(rsi)} — overbought`});
  if(vols.length>21){ const avg=vols.slice(-21,-1).reduce((a,b)=>a+b,0)/20; const curv=vols[vols.length-1]; if(avg>0&&curv>=avg*1.8) out.push({sym,sev:"warn",msg:`Volume ${fmt(curv/avg)}x its 20-day average`}); }
  const w=S.watchlist.find(x=>x.symbol===sym);
  if(w&&w.target&&price!=null){ const diff=(w.target-price)/price*100; if(Math.abs(diff)<=3) out.push({sym,sev:"pos",msg:`Within ${fmt(Math.abs(diff))}% of your target ${fmt(w.target)}`}); }
  return out;
}
function renderSignals(){
  $("#view").innerHTML=`<div class="page-head"><div><h1>Signals</h1><div class="sub">Actionable flags across your watchlist &amp; holdings</div></div>
    <button class="btn" onclick="scanSignals()" ${_sigBusy?'disabled':''}>${_sigBusy?'Scanning…':'Scan now'}</button></div>
    <div class="card"><div class="card-head"><h2>What needs attention</h2><span class="muted">${_sigTs?('updated '+new Date(_sigTs).toLocaleTimeString('en-IN')):''}</span></div><div id="sigbody">${sigBodyHtml()}</div></div>
    <div class="card note"><p>Signals are computed from free Yahoo daily data: 52-week breakouts/lows, RSI(14) oversold/overbought, volume spikes vs the 20-day average, and proximity to your watchlist targets. Informational — not buy/sell advice.</p></div>`;
}
function sigBodyHtml(){
  if(_sigBusy) return `<div class="empty">Scanning ${watchSymbols().length} stocks…</div>`;
  if(!_sigCache) return `<div class="empty">Click “Scan now” to check breakouts, oversold/overbought, volume spikes and target proximity.</div>`;
  if(!_sigCache.length) return `<div class="empty">No signals right now — nothing at extremes.</div>`;
  return `<table><thead><tr><th>Stock</th><th>Signal</th></tr></thead><tbody>${_sigCache.map(s=>`<tr><td><b>${esc(s.sym)}</b></td><td class="${s.sev==='pos'?'pos':s.sev==='neg'?'neg':''}">${esc(s.msg)}</td></tr>`).join("")}</tbody></table>`;
}
async function scanSignals(){
  const syms=watchSymbols(); if(!syms.length){toast("Add watchlist or holdings first");return;}
  _sigBusy=true; renderSignals(); const all=[];
  for(const sym of syms){ try{ const d=await apiSeries(sym); all.push(...computeSignals(sym,d)); }catch(e){} await sleep(200); }
  _sigCache=all; _sigTs=Date.now(); _sigBusy=false; renderSignals();
}

function newsBodyHtml(){

}
async function loadNews(){
  const syms=watchSymbols(); if(!syms.length){toast("Add watchlist or holdings first");return;}
  _newsBusy=true; renderNews(); const all=[];
  for(const sym of syms.slice(0,20)){ try{ const j=await apiNews(sym); (j.items||[]).forEach(it=>all.push(Object.assign({sym},it))); }catch(e){} await sleep(200); }
  all.sort((a,b)=> (new Date(b.pub||0)) - (new Date(a.pub||0)) );
  _newsCache=all; _newsTs=Date.now(); _newsBusy=false; renderNews();
}

const ALERT_KINDS=[["priceAbove","Price ≥"],["priceBelow","Price ≤"],["pctUp","Day % change ≥ (+)"],["pctDown","Day % change ≤ (−)"],["rsiBelow","RSI ≤"],["rsiAbove","RSI ≥"]];

  $("#view").innerHTML=`<div class="page-head"><div><h1>Price alerts</h1><div class="sub">Notified when your conditions hit — while T-Rex is open</div></div>
    <div class="row">
      ${perm==="granted"?'<span class="muted">Notifications on</span>':`<button class="btn ghost" onclick="enableNotif()">Enable notifications</button>`}
      <button class="btn ghost" onclick="checkAlerts(true)">Check now</button>
      <button class="btn" onclick="openAlertForm()">Add alert</button>
    </div></div>
    <div class="card"><div class="card-head"><h2>Your alerts</h2><span class="muted">${esc(_alertMsg)}</span></div><div class="scroll">${alertsTableHtml()}</div></div>
    <div class="card note"><p>Checked every ${S.settings.notify.intervalMin} min while the app (or installed PWA) is open. Each alert fires once when its condition becomes true and re-arms when it goes false. Channels: app notification, sound and email (email needs a Resend key in Netlify — see Settings). For alerts when the app is fully closed, a scheduled backend is required.</p></div>`;
}
function alertsTableHtml(){
  if(!S.alerts.length) return `<div class="empty">No alerts yet. Add one — e.g. “RELIANCE Price ≥ 3000”.</div>`;
  return `<table><thead><tr><th>Stock</th><th>Condition</th><th>Channels</th><th>Status</th><th class="c">On</th><th></th></tr></thead><tbody>${S.alerts.map(a=>`<tr>
    <td><b>${esc(a.symbol)}</b></td>
    <td>${esc(kindLabel(a.kind))} ${esc(String(a.value))}${a.note?` <span class="muted">— ${esc(a.note)}</span>`:''}</td>
    <td class="muted">${[a.channels.app?'app':null,a.channels.sound?'sound':null,a.channels.email?'email':null].filter(Boolean).join(', ')||'—'}</td>
    <td>${a.triggered?'<span class="pill done">triggered</span>':'<span class="pill open">armed</span>'}</td>
    <td class="c"><input type="checkbox" style="width:auto" ${a.active?'checked':''} onchange="toggleAlert('${a.id}')"/></td>
    <td class="r"><button class="btn-sm" onclick="openAlertForm('${a.id}')">Edit</button> <button class="btn-sm danger" onclick="delAlert('${a.id}')">Delete</button></td>
  </tr>`).join("")}</tbody></table>`;
}
function openAlertForm(id){
  const syms=watchSymbols();
  const a=id?S.alerts.find(x=>x.id===id):{symbol:(syms[0]||""),kind:"priceAbove",value:"",note:"",channels:{app:true,sound:true,email:false}};
  openForm(id?"Edit alert":"Add alert",[
    {key:"symbol",label:"Symbol",type:syms.length?"select":"text",options:syms.map(s=>({v:s,l:s})),req:true},
    {key:"kind",label:"Condition",type:"select",options:ALERT_KINDS.map(k=>({v:k[0],l:k[1]}))},
    {key:"value",label:"Value",type:"number",req:true},
    {key:"note",label:"Note (optional)",type:"text"},
    {key:"chApp",label:"App notification",type:"select",options:[{v:"yes",l:"Yes"},{v:"no",l:"No"}]},
    {key:"chSound",label:"Sound",type:"select",options:[{v:"yes",l:"Yes"},{v:"no",l:"No"}]},
    {key:"chEmail",label:"Email",type:"select",options:[{v:"no",l:"No"},{v:"yes",l:"Yes"}]},
  ], Object.assign({},a,{chApp:a.channels.app?"yes":"no",chSound:a.channels.sound?"yes":"no",chEmail:a.channels.email?"yes":"no"}), v=>{
    v.symbol=(v.symbol||"").trim().toUpperCase(); if(!v.symbol) return "Symbol required";
    if(v.value===""||isNaN(+v.value)) return "Enter a numeric value";
    const rec={symbol:v.symbol,kind:v.kind,value:+v.value,note:v.note||"",channels:{app:v.chApp==="yes",sound:v.chSound==="yes",email:v.chEmail==="yes"},active:true};
    if(id){ Object.assign(a,rec); } else { rec.id=uid(); rec.triggered=false; S.alerts.push(rec); }
    save(); closeModal(); restartAlertLoop(); renderAlerts(); toast("Alert saved");
  });
}
function toggleAlert(id){ const a=S.alerts.find(x=>x.id===id); if(a){a.active=!a.active; if(!a.active)a.triggered=false; save(); restartAlertLoop(); renderAlerts();} }
function delAlert(id){ if(confirm("Delete this alert?")){ S.alerts=S.alerts.filter(a=>a.id!==id); save(); restartAlertLoop(); renderAlerts(); } }
function alertMet(a,price,dayPct,rsi){
  switch(a.kind){
    case "priceAbove": return price!=null&&price>=a.value;
    case "priceBelow": return price!=null&&price<=a.value;
    case "pctUp": return dayPct!=null&&dayPct>=a.value;
    case "pctDown": return dayPct!=null&&dayPct<=-Math.abs(a.value);
    case "rsiBelow": return rsi!=null&&rsi<=a.value;
    case "rsiAbove": return rsi!=null&&rsi>=a.value;
  } return false;
}
async function checkAlerts(manual){
  const active=S.alerts.filter(a=>a.active); if(!active.length){ if(manual)toast("No active alerts"); return; }
  const syms=[...new Set(active.map(a=>a.symbol))]; const data={};
  for(const sym of syms){ try{ data[sym]=await apiSeries(sym); }catch(e){} await sleep(150); }
  let fired=0;
  for(const a of active){ const d=data[a.symbol]; if(!d) continue;
    const price=d.meta&&d.meta.price; const prev=d.meta&&d.meta.prevClose;
    const dayPct=(price!=null&&prev)?(price-prev)/prev*100:null;
    const rsi=rsiFromCloses((d.closes||[]).filter(x=>x!=null));
    const met=alertMet(a,price,dayPct,rsi);
    if(met&&!a.triggered){ a.triggered=true; a.lastTriggered=Date.now(); fireAlert(a,price,dayPct); fired++; }
    else if(!met&&a.triggered){ a.triggered=false; }
  }
  save(); _alertMsg="Last checked "+new Date().toLocaleTimeString('en-IN');
  if(manual) toast(fired?`${fired} alert(s) fired`:"Checked — nothing triggered");
  if(current==="alerts") renderAlerts();
}
function fireAlert(a,price,dayPct){
  const title=`T-Rex: ${a.symbol} ${kindLabel(a.kind)} ${a.value}`;
  const body=`${a.symbol} at ${cur(price)}${dayPct!=null?` (${dayPct>=0?'+':''}${fmt(dayPct)}% today)`:''}${a.note?` — ${a.note}`:''}`;
  if(a.channels.app) notify(title,body);
  if(a.channels.sound&&S.settings.notify.sound) playBeep();
  if(a.channels.email&&S.settings.notify.email) sendEmail(title, body+"\n\n— T-Rex Portfolio Desk");
  toast(title);
}
function notify(title,body){
  try{
    if(typeof Notification==="undefined"||Notification.permission!=="granted") return;
    const opts={body,icon:"icon-192.png",badge:"icon-192.png",tag:"trex-"+title};
    if(navigator.serviceWorker&&navigator.serviceWorker.ready){ navigator.serviceWorker.ready.then(r=>r.showNotification(title,opts)).catch(()=>{ try{new Notification(title,opts);}catch(e){} }); }
    else { new Notification(title,opts); }
  }catch(e){}
}
function enableNotif(){
  if(typeof Notification==="undefined"){ toast("Notifications not supported here"); return; }
  Notification.requestPermission().then(p=>{ toast(p==="granted"?"Notifications enabled":"Notifications "+p); if(current==="alerts")renderAlerts(); });
}
function playBeep(){
  try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return; const ctx=new AC();
    const beep=(f,st,du)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(0.0001,ctx.currentTime+st);g.gain.exponentialRampToValueAtTime(0.4,ctx.currentTime+st+0.02);g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+st+du);o.start(ctx.currentTime+st);o.stop(ctx.currentTime+st+du);};
    beep(880,0,0.18); beep(1175,0.2,0.24);
    setTimeout(()=>{try{ctx.close();}catch(e){}},1300);
  }catch(e){}
}
async function sendEmail(subject,text){
  const to=S.settings.notify.email; if(!to){ toast("Set an alert email in Settings"); return; }
  try{ const r=await fetch("/.netlify/functions/send-alert",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({to,subject,text})});
    const j=await r.json(); toast(j.ok?"Email sent":("Email: "+(j.error||"failed"))); }
  catch(e){ toast("Email failed: "+e.message); }
}
function testEmail(){ sendEmail("T-Rex test alert","This is a test email from your T-Rex Portfolio Desk."); }
function saveNotify(){
  S.settings.notify.email=($("#ntEmail").value||"").trim();
  S.settings.notify.intervalMin=Math.max(1,+($("#ntInt").value||5));
  S.settings.notify.sound=$("#ntSound").checked;
  S.settings.notify.browser=$("#ntBrowser").checked;
  save(); toast("Saved"); restartAlertLoop(); renderSettings();
}
let _alertTimer=null;
function startAlertLoop(){
  if(_alertTimer){ clearInterval(_alertTimer); _alertTimer=null; }
  const mins=Math.max(1,+(S.settings.notify.intervalMin||5));
  const hosted=(typeof location!=="undefined")&&/^https?:/.test((location.protocol||""));
  if(hosted && S.alerts.some(a=>a.active)){ _alertTimer=setInterval(()=>checkAlerts(false), mins*60000); setTimeout(()=>checkAlerts(false),4000); }
}
function restartAlertLoop(){ startAlertLoop(); maybeSyncCloud(); }
async function syncCloud(silent){
  const c=S.settings.cloud||{};
  if(!c.enabled){ if(!silent)toast("Enable cloud alerts first"); return; }
  if(!c.secret){ if(!silent)toast("Set the sync secret first"); return; }
  try{
    const r=await fetch("/.netlify/functions/sync-alerts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({secret:c.secret,email:S.settings.notify.email,suffix:S.settings.suffix||"",alerts:S.alerts})});
    const j=await r.json(); const el=$("#clStatus");
    if(j.ok){ if(el)el.textContent="Synced "+(j.count||0)+" alert(s) at "+new Date().toLocaleTimeString('en-IN'); if(!silent)toast("Cloud alerts synced"); }
    else { if(el)el.textContent="Sync failed: "+(j.error||""); if(!silent)toast("Sync failed: "+(j.error||"")); }
  }catch(e){ const el=$("#clStatus"); if(el)el.textContent="Sync failed"; if(!silent)toast("Sync failed: "+e.message); }
}
function maybeSyncCloud(){ if(S.settings.cloud&&S.settings.cloud.enabled&&S.settings.cloud.secret) syncCloud(true); }
function saveCloud(){ S.settings.cloud.secret=($("#clSecret").value||"").trim(); S.settings.cloud.enabled=$("#clOn").checked; save(); toast("Saved"); syncCloud(); renderSettings(); }
async function enablePush(){
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)){ toast("Push not supported on this device/browser"); return; }
    if(typeof Notification==="undefined"){ toast("Notifications not supported"); return; }
    const c=S.settings.cloud||{}; if(!c.secret){ toast("Set the sync secret first, then Save & sync"); return; }
    let perm=Notification.permission; if(perm!=="granted") perm=await Notification.requestPermission();
    if(perm!=="granted"){ toast("Notifications "+perm); return; }
    const reg=await navigator.serviceWorker.ready;
    const kr=await fetch("/.netlify/functions/vapid-public"); const kj=await kr.json();
    if(!kj.publicKey){ toast("Server push key (VAPID) not set — see DEPLOY.md"); return; }
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlB64ToUint8(kj.publicKey)});
    const r=await fetch("/.netlify/functions/save-subscription",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({secret:c.secret,subscription:sub})});
    const j=await r.json();
    if(j.ok){ S.settings.cloud.push=true; save(); toast("Phone push enabled"); const el=$("#pushStatus"); if(el)el.textContent="push on"; }
    else toast("Push: "+(j.error||"failed"));
  }catch(e){ toast("Push failed: "+e.message); }
}
function urlB64ToUint8(b64){ const pad="=".repeat((4-b64.length%4)%4); const s=(b64+pad).replace(/-/g,"+").replace(/_/g,"/"); const raw=atob(s); const arr=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i); return arr; }
async function testPush(){
  const c=S.settings.cloud||{}; if(!c.secret){ toast("Set the sync secret first, then Save & sync"); return; }
  try{ const r=await fetch("/.netlify/functions/test-push",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({secret:c.secret})});
    const j=await r.json(); toast(j.ok?("Test push sent to "+j.sent+" device(s)"):("Push: "+(j.error||"failed"))); }
  catch(e){ toast("Push failed: "+e.message); }
}
